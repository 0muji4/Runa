name: iOS CI

# kotlin-ci.yaml と同じくパスで絞らない。必須チェックにパスフィルタを付けると
# 条件に合わない PR でチェックが報告されず永久に pending になるため。
on:
  pull_request:
  # 既定ブランチでしか Gradle / Kotlin/Native のキャッシュが書き込まれない。
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-build:
    runs-on: macos-latest
    # Kotlin/Native は 3 ターゲット分をコンパイルするため初回が重い。ハングの上限として置く。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # XCFramework は Gradle でビルドするので JDK が要る（shared の jvmToolchain(17)）。
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: apps/kotlin
      # Kotlin/Native のツールチェーンは ~/.konan に置かれ、Gradle のキャッシュ対象外。
      # 別途キャッシュしないと毎回 1GB 近いダウンロードが走る。キーは Kotlin の
      # バージョンを含む libs.versions.toml に紐づける。
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('apps/kotlin/gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      # :shared は com.android.library を適用しているため、XCFramework だけを作る場合でも
      # Gradle の設定フェーズで Android SDK が要る。macOS ランナーには同梱されていない。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install XcodeGen
        run: brew install xcodegen
      # SharedKit/Package.swift が XCFramework を binaryTarget で相対参照するため、
      # プロジェクト生成より前にビルドしておく必要がある。
      #
      # release ではなく debug をビルドする。Kotlin/Native の release は LLVM の最適化が
      # 入って桁違いに遅く（計測では 3 アーキで 774 秒）、この job の目的である
      # 「Swift と SKIE ブリッジがコンパイルできるか」の検証に最適化は要らない。
      # 公開される API 表面は debug でも同じなので、検証能力は落ちない。
      - name: Build XCFramework
        working-directory: apps/kotlin
        run: ./gradlew :shared:assembleSharedDebugXCFramework
      # Package.swift の binaryTarget は release のパスを直に指している。CI だけ debug を
      # 使うので、生成物をそのパスに置き換える。ランナーは使い捨てのため手元のビルドには
      # 影響しない（make ios-build は従来どおり release をビルドする）。
      - name: Stage the debug XCFramework where SharedKit expects it
        run: |
          src=apps/kotlin/shared/build/XCFrameworks/debug/Shared.xcframework
          dst=apps/kotlin/shared/build/XCFrameworks/release
          # 出力パスが変わったら xcodebuild の不可解なエラーではなくここで落とす。
          test -d "$src" || { echo "XCFramework not found at $src"; exit 1; }
          mkdir -p "$dst"
          rm -rf "$dst/Shared.xcframework"
          cp -R "$src" "$dst/Shared.xcframework"
      # Runa.xcodeproj は生成物（gitignore 対象）なので毎回作る。
      - name: Generate Xcode project
        working-directory: apps/swift
        run: xcodegen generate
      # Makefile の ios-build は IOS_SIM で実機名を指定するが、CI ではランナーの
      # シミュレータ構成に依存して壊れる。ビルドだけなら generic 宛先で足りる。
      - name: Build app
        working-directory: apps/swift
        run: |
          xcodebuild -project Runa.xcodeproj -scheme Runa \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build
